[project]
name = "m2-deep-learning-coursework"
version = "0.1.0"
description = "Normalizing Flow coursework for the M2 Deep Learning module"
readme = "README.MD"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Harvey Bermingham" }
]

dependencies = [
  "torch>=2.0.0",
  "numpy>=1.24.0",
  "matplotlib>=3.7.0",
  "pandas>=2.0.0",
  "tqdm>=4.0.0",
  "scikit-learn>=1.3.0",
  "optuna>=3.0.0",
  "ipykernel>=6.0.0",
  "jupyterlab>=4.0.0",
  "ipywidgets>=8.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "ruff>=0.1.0",
  "black>=23.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"